<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula Bootstrap</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
   
  </style>
</head>
<body>

  <!-- Carousel -->
  <div id="meuCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#meuCarousel" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="imagem/dark soul 2.01.webp" class="d-block w-100" alt="Primeiro Slide">
        <div class="carousel-caption d-none d-md-block">
          <h5>Dark Souls</h5>
        </div>
      </div>
      <div class="carousel-item">
        <img src="imagem/dark souls 2.02.jpg" class="d-block w-100" alt="Segundo Slide">
        <div class="carousel-caption d-none d-md-block">
          <h5>Dark Souls</h5>
        </div>
      </div>
      <div class="carousel-item">
        <img src="imagem/dark souls 2.03.jpg" class="d-block w-100" alt="Terceiro Slide">
        <div class="carousel-caption d-none d-md-block">
          <h5>Dark Souls</h5>
        </div>
      </div>
    </div>
  </div>

  <!-- Seção de Produtos -->
  <section class="container my-5">
    <h2 class="text-center text-secondary mb-4"><i class="bi bi-feather"></i> Loja Souls</h2>

    
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

    

    <!-- Controles -->
    <button class="carousel-control-prev" type="button" data-bs-target="#meuCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#meuCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Próximo</span>
    </button>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
