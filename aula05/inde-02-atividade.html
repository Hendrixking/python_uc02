<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Estrutura HTML5</title>
    <meta name="description" content="Uma página de exemplo para demonstrar a estrutura básica do HTML5.">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .form-container {
            width: 50%;
            margin-left: 0;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 40px; /* Adicionado para dar espaço ao footer */
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
        }

        button[type="submit"] {
            background-color: #007BFF;
            color: white;
            border: none;
        }

        main {
            padding: 40px;
            flex-grow: 1; /* Garante que o main ocupe o espaço restante */
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
            margin-top: auto; /* Garante que o rodapé fique no final da página */
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1 style="text-align: center;">Formulário</h1>
    </header>

    <!-- MAIN -->
    <main>
        <section id="section1" class="form-container">
            <form action="/cadastro" method="post" target="_blank">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@email.com">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required pattern="[0-9]{11}" placeholder="Apenas números (11 dígitos)">

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required minlength="6" placeholder="Mínimo 6 caracteres">

                <div style="display: flex; gap: 10px;">
                    <button type="submit">Cadastrar</button>
                    <button type="reset">Limpar</button>
                </div>
            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer id="footer">
        <p>&copy; 2025 - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
