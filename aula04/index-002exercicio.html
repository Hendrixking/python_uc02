<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela de Tênis com Bootstrap 5</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .img-tenis {
            width: 100px;
            height: auto;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>  
    <div class="table-container">
        <table>
          <caption>Catálogo de Tênis - Preços 2023</caption>
          <thead>
            <tr>
              <th scope="col"><img src="https://placehold.co/600x400"></th>Modelo</th>
              <th scope="col">Marca</th>
              <th scope="col">Preço Original</th>
              <th scope="col">Preço com Desconto</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Runner X</td>
              <td>Nike</td>
              <td>R$ 599,90</td>
              <td rowspan="2">R$ 499,90 (Combo)</td>
            </tr>
            <tr>
              <td>Air Max</td>
              <td>Nike</td>
              <td>R$ 799,90</td>
            </tr>
            <tr>
              <td>UltraBoost</td>
              <td>Adidas</td>
              <td colspan="2">Promoção Esgotada</td>
            </tr>
          </tbody>
        </table>
      </div>
</head>
 <table>
    <!-- Head da Tabela -->   
    <thead>
      <!-- Linha -->       
      <tr>
        <th>Produto</th>
        <th>Preço</th>
      </tr>
    </thead>
    <!-- Corpo da tabela --> 
    <tbody>
      <!-- Linha -->     
      <tr>        
        <td>Tênis A</td>
        <td>R$ 299,90</td>
      </tr>
    </tbody>
  </table>
  <tr>
    <td colspan="2">Promoção Relâmpago</td>
  </tr>
  <tr>
    <td rowspan="2">Tênis B</td>
    <td>R$ 399,90</td>
  </tr>
  <tr>
    <td>Desconto: 10%</td>
  </tr>
  <table aria-label="Tabela de Preços de Tênis">
    <caption>Preços da Loja de Tênis</caption>
    <thead>
      <tr>
        <th scope="col">Modelo</th>
        <th scope="col">Preço</th>
      </tr>
    </thead>
  </table>


   <!-- Bootstrap JS -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
