<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Estrutura HTML5</title>
    <meta name="description" content="Uma página de exemplo para demonstrar a estrutura básica do HTML5.">
    <link rel="stylesheet" href="styles.css">
    <style>

        body {
            font-family: 'Ariel', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #db4444, #0db9d8 );
            min-height: 100vh;
        
        }

        h1 {
            color: rgb(16, 240, 221);
            font-size: 2.5em;
            font-weight: bold;

        }

        p {
            color: rgb(16, 189, 233);
            font-size: 16px;
            line-height: 1.5;
        }

        .caixa {
            background-color: rgb(7, 218, 255);
            border: 30px dashed rgb(255, 255, 255);
            padding: 20px;
            margin: 15px 0;
            text-align: center;
        
        }


        img.w800 {
            width:800px;
        }

        img.h800 {
            height:800px
        }

        figure {
            margin-left: 0px;
            margin-right: 0px;
            margin-top: 20px;
            border: 2px solid black;
        }   

        img.w300_redonda {
            width: 300px;
            height: auto;
            clip-path: circle(50%);
        
        }

        img.wmax {
            max-width: 100%;
            height: auto;

        }
        
       

    </style>

</head>
<body>
    <!-- Elemento HEADER --> 
    <header>
        <h1>aula 02 imagens - parte 01</h1>
    </header>

    <!-- Ememento MAIN - Área principal da página -->
    <main>
        <section id="section1">
            <h2>Imagem original</h2>

            <p>Esta é a primeira seção da pagina.<br>
               Aqui você pode adicionar informações.
               Introdutorias.</p>

            <div class="caixa">
              conteudo formatado
            </div>
        </selection>

        <figure>
            <img src="imagens-atividade/mazda rx-7.png"
                alt="por do sol"
                width="800px">
        </section>

        <section id="section2">
            <h2>Imagem com 800px de largura</h2>
            <img src="imagens-atividade/mazda rx-7.png"
                alt="por do sol"
                class="w700px">
        
    
        </section>

        <figure>
            <img src="imagens/codigo/img/paisagem-original.jpg"
                alt="por do sol"
                class="h800">
                <figcaption>
                    paisagem - imagem original
                </figcaption>
        </figure>
            
        <figure>
            <img src="imagens/codigo/img/paisagem-original.jpg"
                alt="por do sol"
                class="w300_redonda">
                <figcaption>
                    paisagem - imagem original
                </figcaption>
            </figure>
        
        </figure>
            <img src="imagens/codigo/img/paisagem-original.jpg"
                alt="por do sol"
                class="wmax">
                <figcaption>
                    paisagem - imagem original
                </figcaption>
            </figure>






    
    </main>

    <!-- Elemento FOOTER - Roda-pé da página --> 
    <footer id="footer">
        <p>&copy; 2025 - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
